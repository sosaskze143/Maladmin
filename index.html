<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
  <meta charset="UTF-8">
  <title>نقل ملكية العملة</title>
  <link rel="stylesheet" href="style.css">
</head>
<body>
  <h1>نقل ملكية العملة</h1>

  <form id="transferForm">
    <label for="serial">رقم العملة:</label>
    <input type="text" id="serial" required placeholder="مثال: 143-12345">

    <label for="newOwner">اختر المالك الجديد:</label>
    <select id="newOwner" required>
      <option value="">-- اختر --</option>
      <option>الحكومة</option>
      <option>بيان سعد الشهراني</option>
      <option>وجدان سعد الشهراني</option>
      <option>محمد سعد الشهراني</option>
    </select>

    <label for="adminCode">رمز المرور الإداري:</label>
    <input type="password" id="adminCode" required placeholder="••••••">

    <button type="submit">نقل الملكية</button>
  </form>

  <div id="alert"></div>

  <p><a href="search.html">الذهاب إلى صفحة البحث والسجل</a></p>

  <script src="data.js"></script>
  <script src="transfer.js"></script>
  <script src="https://cdnjs.cloudflare.com/ajax/libs/jspdf/2.5.1/jspdf.umd.min.js"></script>
</body>
</html>
