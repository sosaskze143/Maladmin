<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
  <meta charset="UTF-8">
  <title>نظام إدارة العملات</title>
  <link rel="stylesheet" href="style.css">
</head>
<body>
  <div class="container">
    <h1>نظام إدارة العملات</h1>
    <p>مرحبًا بك في نظام إدارة وتحويل العملات.</p>

    <div class="card">
      <h2>الوظائف المتاحة:</h2>
      <ul>
        <li><a href="transfer.html" class="button">نقل ملكية عملة</a></li>
        <li><a href="search.html" class="button">البحث عن عملة</a></li>
        <li><a href="log.html" class="button">سجل التحويلات</a></li>
        <li><button onclick="downloadCSV()" class="button">تحميل كل السجلات CSV</button></li>
      </ul>
    </div>
  </div>

  <script>
    function downloadCSV() {
      const transfers = JSON.parse(localStorage.getItem("transfers") || "[]");
      if (transfers.length === 0) {
        alert("لا توجد عمليات محفوظة.");
        return;
      }

      const header = "رقم العملة,الفئة,المالك السابق,المالك الجديد,التاريخ,رمز الموافقة\n";
      const rows = transfers.map(t => {
        return `${t.id},${t.value},${t.from},${t.to},${t.date},${t.code}`;
      }).join("\n");

      const blob = new Blob([header + rows], { type: 'text/csv;charset=utf-8;' });
      const url = URL.createObjectURL(blob);
      const a = document.createElement("a");
      a.href = url;
      a.download = "سجل_التحويلات.csv";
      a.click();
    }
  </script>
</body>
</html>
